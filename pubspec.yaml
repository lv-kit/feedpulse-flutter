name: feedpulse
description: "Feedpulse Flutter SDK. Headless client: app attestation (App Attest / Play Integrity), config, validation, submit with retry, plus a widget target picker."
version: 0.1.0
repository: https://github.com/lv-kit/feedpulse-flutter
issue_tracker: https://github.com/lv-kit/feedpulse-flutter/issues
topics:
  - feedback
  - bug-report
  - widget-inspector

environment:
  sdk: ^3.13.4
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.feedpulse.flutter
        pluginClass: FeedpulsePlugin
      ios:
        pluginClass: FeedpulsePlugin
